name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install

      - name: Validate PR Title
        run: echo "${{ github.event.pull_request.title }}" | bun x commitlint

      - name: Validate PR Commits
        run: |
          bun x commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  code-quality:
    name: Lint, Arch & Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install 

      - name: Check code formatting and linting (Biome)
        run: bun run check

      - name: Check architectural boundary invariants
        run: bun run check:arch

      - name: Validate documentation links and navigation
        run: node docs/scripts/check-docs.mjs

  typecheck:
    name: Typecheck Workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install 

      - name: Build all packages (generate declaration files)
        run: bun run build:packages

      - name: Run parallel workspace type checking
        run: bun run check:types

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install 

      - name: Build all packages
        run: bun run build:packages

      - name: Run tests across packages and applications
        run: bun run test

  build:
    name: Build Packages & Plugins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install 

      - name: Build all packages
        run: bun run build:packages

      - name: Build all plugins
        run: |
          if [ -d "plugins" ] && [ $(find plugins -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l) -gt 0 ]; then
            bun run build:plugins
          else
            echo "No plugin packages found (excluded by .git/info/exclude). Skipping plugin build."
          fi

  ci-gate:
    name: CI Status Gate
    needs: [code-quality, typecheck, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI Results
        run: |
          echo "code-quality: ${{ needs.code-quality.result }}"
          echo "typecheck:    ${{ needs.typecheck.result }}"
          echo "test:         ${{ needs.test.result }}"
          echo "build:        ${{ needs.build.result }}"

          if [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::One or more essential CI checks failed."
            exit 1
          fi
          echo "All CI checks completed successfully!"
